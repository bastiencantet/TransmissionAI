<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemotron Browser Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Nemotron Browser Chat</h1>
        <p>
          Runs <code>nvidia/nemotron-3-nano-4b</code> locally in your browser using
          WebGPU.
        </p>
      </header>

      <section class="controls">
        <label for="model-id">Model ID</label>
        <input id="model-id" type="text" value="nvidia/nemotron-3-nano-4b" />
        <button id="load-model">Load model</button>
        <span id="status">Idle</span>
      </section>

      <section id="chat" class="chat" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea
          id="prompt"
          rows="3"
          placeholder="Ask something..."
          required
        ></textarea>
        <button type="submit" id="send">Send</button>
      </form>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
